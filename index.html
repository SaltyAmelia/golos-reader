<!doctype html>
<html lang="ru" data-design="liquid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Голос — чтение текста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f3f5;
      --card: #ffffff;
      --text: #16191d;
      --muted: #6f7782;
      --line: #dfe3e8;
      --accent: #2481cc;
      --accent-dark: #1d6fae;
      --accent-soft: #eaf4fb;
      --danger: #d74b62;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 21px;
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.1; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .badge {
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      background: #e4e8ec;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }
    .label { font-size: 15px; font-weight: 750; }
    .count { color: var(--muted); font-size: 12px; }

    textarea {
      display: block;
      width: 100%;
      min-height: 190px;
      resize: vertical;
      padding: 15px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      outline: 0;
      background: #fff;
      color: var(--text);
      line-height: 1.55;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    textarea::placeholder { color: #aaa4b5; }

    .section { margin-top: 20px; }
    .section-title { margin: 0 0 10px; font-size: 15px; }

    .voices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .voice {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .voice.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .voice-icon {
      display: grid;
      flex: 0 0 34px;
      height: 34px;
      place-items: center;
      border-radius: 8px;
      background: #edf0f3;
      font-size: 17px;
    }
    .voice.active .voice-icon { background: var(--accent); color: white; }
    .voice-copy { min-width: 0; }
    .voice-name { display: block; font-size: 14px; font-weight: 750; }
    .voice-system {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }
    .segments {
      display: flex;
      gap: 5px;
      padding: 4px;
      border-radius: 10px;
      background: #edf0f3;
    }
    .segments button {
      flex: 1;
      padding: 8px 7px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .segments button.active {
      background: white;
      color: var(--accent-dark);
      box-shadow: 0 1px 2px rgba(20, 28, 36, .08);
    }

    .speed-head { display: flex; align-items: center; justify-content: space-between; }
    .speed-value { color: var(--accent-dark); font-size: 14px; font-weight: 750; }
    .speed-range {
      width: 100%;
      height: 6px;
      margin: 11px 0 8px;
      border-radius: 999px;
      outline: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .speed-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }

    .preview {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 0;
      background: transparent;
      color: var(--accent-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .actions { display: flex; gap: 9px; margin-top: 17px; }
    .primary, .secondary, .stop {
      min-height: 52px;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    .primary {
      flex: 1;
      background: var(--accent);
      color: white;
    }
    .primary:active { background: var(--accent-dark); transform: translateY(1px); }
    .secondary, .stop { display: none; width: 54px; background: #f1eff6; color: var(--text); }
    .stop { color: var(--danger); }
    .playing .secondary, .playing .stop { display: block; }

    .status {
      min-height: 20px;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .hint { margin: 14px 4px 0; color: var(--muted); font-size: 12px; text-align: center; }

    dialog {
      width: min(calc(100% - 28px), 460px);
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: white;
      color: var(--text);
      box-shadow: 0 24px 80px rgba(31, 22, 61, .3);
    }
    dialog::backdrop { background: rgba(25, 20, 40, .55); backdrop-filter: blur(3px); }
    .dialog-body { padding: 22px; }
    .dialog-body h2 { margin: 0; font-size: 21px; }
    .dialog-body p { margin: 8px 0 17px; color: var(--muted); font-size: 14px; }
    .key-input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      outline: 0;
      background: #fbfaff;
    }
    .key-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .key-help { display: block; margin-top: 9px; color: var(--accent-dark); font-size: 13px; font-weight: 700; }
    .dialog-actions { display: flex; gap: 8px; margin-top: 19px; }
    .dialog-actions button { min-height: 45px; border: 0; border-radius: 13px; font-weight: 750; cursor: pointer; }
    .connect { flex: 1; background: var(--accent); color: white; }
    .cancel { padding: 0 16px; background: #f1eff6; color: var(--text); }
    .key-note { margin-bottom: 0 !important; font-size: 12px !important; }

    @media (max-width: 510px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .panel { padding: 15px; border-radius: 12px; }
      textarea { min-height: 170px; }
      .row { grid-template-columns: 1fr; gap: 16px; }
    }
  </style>
  <style id="musicload-theme">

      background: rgba(255,255,255,.07); color: var(--text);

    @media (max-width: 510px) {

  <style id="liquid-controls">

      border: 1px solid #343438; border-radius: 18px; background: #202022;
      box-shadow: inset 0 1px rgba(255,255,255,.045);
      transition: color .22s ease, border-color .22s ease, background .22s ease, transform .22s cubic-bezier(.2,.9,.25,1.25);
    }
    .settings-card .voice:nth-child(n) { border: 1px solid #343438; }
    .settings-card .voice.active {
      border-color: transparent; background: transparent; box-shadow: none;
    }
    .settings-card .voice-icon { width: 36px; height: 36px; flex-basis: 36px; border-radius: 12px; }
    .settings-card .voice.active .voice-icon {
      border-color: #5b5b60; background: #48484a; color: #fff;
      box-shadow: inset 0 1px rgba(255,255,255,.16), 0 2px 6px rgba(0,0,0,.24);
      transform: scale(1.06);
    }
    .settings-card .voice.active .voice-name { color: #fff; }
    .settings-card .voice > * { position: relative; z-index: 2; }
    .voice-selection {
      --voice-scale-x: 1; --voice-scale-y: 1;
      position: absolute; left: 0; top: 0; z-index: 0; opacity: 0;
      border: 1px solid #5b5b60; border-radius: 18px; background: #303033;
      box-shadow: 0 4px 12px rgba(0,0,0,.26), inset 0 1px rgba(255,255,255,.16), inset 0 -1px rgba(255,255,255,.035);
      transform: scaleX(var(--voice-scale-x)) scaleY(var(--voice-scale-y));
      transform-origin: center; pointer-events: none; will-change: left, top, width, height, transform;
      transition: left .34s cubic-bezier(.34,1.12,.64,1), top .34s cubic-bezier(.34,1.12,.64,1), width .28s ease, height .28s ease, transform .46s cubic-bezier(.16,1.38,.34,1), opacity .16s ease;
    }
    .voice-selection.ready { opacity: 1; }
    .voice-selection.no-transition { transition: none; }
    @keyframes voice-icon-pick {
      0% { transform: scale(.86); }
      62% { transform: scale(1.14); }
      100% { transform: scale(1.06); }
    }
    .settings-card .voice.voice-picked .voice-icon { animation: voice-icon-pick .42s cubic-bezier(.2,.9,.25,1.35); }

    .segments { position: relative; isolation: isolate; overflow: hidden; touch-action: none; }
    .segments-indicator {
      --liquid-scale-x: 1; --liquid-scale-y: 1; --liquid-shift-x: 0px;
      position: absolute; top: 3px; bottom: 3px; left: 3px; z-index: 0;
      border: 1px solid #5b5b60; border-radius: 17px; background: #3a3a3c;
      box-shadow: 0 1px 3px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.16);
      transform: translate3d(var(--liquid-shift-x),0,0) scaleX(var(--liquid-scale-x)) scaleY(var(--liquid-scale-y));
      transform-origin: center; transition: left .28s cubic-bezier(.34,1.2,.64,1), width .28s cubic-bezier(.34,1.2,.64,1), transform .48s cubic-bezier(.16,1.42,.36,1);
      pointer-events: none; will-change: left, width, transform;
    }
    .segments-indicator.dragging { transition: none; }
    .segments button { position: relative; z-index: 1; border: 0 !important; background: transparent !important; box-shadow: none !important; }

    .primary, .settings-card, .segments, .preview { position: relative; isolation: isolate; }
    .primary::after, .settings-card::after, .preview::after {
      position: absolute; inset: 0; z-index: 3; border-radius: inherit; padding: 1px;
      background: conic-gradient(from 225deg, rgba(255,255,255,.025), rgba(255,255,255,.05) 22%, rgba(255,255,255,.28) 42%, rgba(255,255,255,.11) 57%, rgba(0,0,0,.20) 76%, rgba(255,255,255,.025));
      content: ""; pointer-events: none;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }
    .preview { width: fit-content; min-height: 40px; margin: 10px auto 0; padding: 0 16px; border-radius: 20px; background: #1c1c1e; }
    .primary {
      -webkit-backdrop-filter: url(#liquidRefraction) blur(18px) saturate(170%) brightness(1.08);
      backdrop-filter: url(#liquidRefraction) blur(18px) saturate(170%) brightness(1.08);
    }
    .liquid-jelly {
      --liquid-button-x: 0px; --liquid-button-y: 0px;
      --liquid-button-sx: 1; --liquid-button-sy: 1;
      transform: translate3d(var(--liquid-button-x),var(--liquid-button-y),0) scaleX(var(--liquid-button-sx)) scaleY(var(--liquid-button-sy));
      transform-origin: center; will-change: transform;
      transition: transform .42s cubic-bezier(.16,1.38,.34,1), filter .2s ease;
    }
    .liquid-jelly.liquid-pressed { transition: none; filter: brightness(1.12); }

    .speed-range {
      height: 28px; margin: 1px 0 3px; appearance: none; -webkit-appearance: none;
      background: transparent; touch-action: pan-y; cursor: pointer;
    }
    .speed-range::-webkit-slider-runnable-track {
      height: 4px; border-radius: 99px;
      background: linear-gradient(to right, #0a84ff 0 var(--speed-progress,14.29%), #38383a var(--speed-progress,14.29%) 100%);
    }
    .speed-range::-webkit-slider-thumb {
      width: 18px; height: 18px; margin-top: -7px; appearance: none; -webkit-appearance: none;
      border: 1px solid rgba(255,255,255,.45); border-radius: 50%; background: #0a84ff;
      box-shadow: 0 2px 7px rgba(0,0,0,.34);
    }
    .speed-range::-moz-range-track { height: 4px; border: 0; border-radius: 99px; background: #38383a; }
    .speed-range::-moz-range-progress { height: 4px; border-radius: 99px; background: #0a84ff; }
    .speed-range::-moz-range-thumb { width: 18px; height: 18px; border: 1px solid rgba(255,255,255,.45); border-radius: 50%; background: #0a84ff; }

    .control-icon {
      display: block; width: 20px; height: 20px; margin: auto;
      fill: currentColor; pointer-events: none;
    }

    .playback { display: none; margin-top: 14px; padding: 12px 14px 10px; border: 1px solid #303035; border-radius: 20px; background: #1c1c1e; }
    .audio-ready .playback { display: block; animation: playback-enter .42s cubic-bezier(.2,.9,.25,1.15) both; }
    .seek-range {
      width: 100%; height: 22px; margin: 0; appearance: none; -webkit-appearance: none;
      background: transparent; cursor: pointer;
    }
    .seek-range:disabled { cursor: wait; opacity: .55; }
    .seek-range::-webkit-slider-runnable-track {
      height: 4px; border-radius: 99px;
      background: linear-gradient(to right, #0a84ff 0 var(--seek-progress,0%), #38383a var(--seek-progress,0%) 100%);
    }
    .seek-range::-webkit-slider-thumb {
      width: 16px; height: 16px; margin-top: -6px; appearance: none; -webkit-appearance: none;
      border: 1px solid rgba(255,255,255,.52); border-radius: 50%; background: #f5f5f7;
      box-shadow: 0 1px 5px rgba(0,0,0,.34);
    }
    .seek-range::-moz-range-track { height: 4px; border: 0; border-radius: 99px; background: #38383a; }
    .seek-range::-moz-range-progress { height: 4px; border-radius: 99px; background: #0a84ff; }
    .seek-range::-moz-range-thumb { width: 16px; height: 16px; border: 1px solid rgba(255,255,255,.52); border-radius: 50%; background: #f5f5f7; }
    .playback-time { display: flex; justify-content: space-between; margin-top: 1px; color: #8e8e93; font-size: 10px; font-variant-numeric: tabular-nums; }

    .send-chat {
      display: flex; width: 100%; min-height: 44px; align-items: center; justify-content: center;
      gap: 8px; margin-top: 10px; border: 1px solid #3a3a3c; border-radius: 22px;
      background: #29292c; color: #f5f5f7; font: 650 14px inherit; cursor: pointer;
      transition: background .2s ease, color .2s ease, opacity .2s ease;
    }
    .send-chat svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .send-chat:active { background: #343438; }
    .send-chat:disabled { cursor: wait; opacity: .72; }
    .send-chat.sending svg { animation: send-flight .85s ease-in-out infinite; }
    .send-chat.sent { color: #55c58a; }

    textarea { transition: border-color .22s ease, background .22s ease, transform .24s cubic-bezier(.2,.8,.25,1); }
    textarea:focus { transform: translateY(-1px); }
    textarea.typing { animation: text-breathe .26s ease-out; }
    .settings-card summary { transition: background .2s ease, color .2s ease; }
    .settings-card summary:active { background: rgba(255,255,255,.045); }
    .settings-card[open] .settings-body { transform-origin: top; animation: settings-enter .34s cubic-bezier(.2,.82,.25,1) both; }
    .speed-value { transition: transform .2s cubic-bezier(.2,.9,.25,1.3), color .2s ease; }
    .speed-section.adjusting .speed-value { color: #fff; transform: scale(1.12); }
    .speed-range::-webkit-slider-thumb, .seek-range::-webkit-slider-thumb { transition: transform .18s cubic-bezier(.2,.9,.25,1.3), box-shadow .18s ease; }
    .speed-range:active::-webkit-slider-thumb { transform: scale(1.18); box-shadow: 0 2px 12px rgba(10,132,255,.42); }
    .seek-range:active::-webkit-slider-thumb { transform: scale(1.18); }
    .status.status-pop { animation: status-pop .3s ease-out; }
    .primary.loading { overflow: hidden; }
    .primary.loading::before {
      position: absolute; inset: 0; z-index: 1; content: ""; pointer-events: none;
      background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,.24) 46%, transparent 67%);
      transform: translateX(-110%); animation: button-shimmer 1.15s ease-in-out infinite;
    }
    .primary.speaking { animation: speaking-pulse 1.8s ease-in-out infinite; }
    .primary, .secondary, .stop, .send-chat, .preview { -webkit-tap-highlight-color: transparent; }

    @keyframes playback-enter {
      from { opacity: 0; transform: translateY(10px) scale(.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes settings-enter {
      from { opacity: 0; transform: translateY(-7px) scaleY(.96); }
      to { opacity: 1; transform: translateY(0) scaleY(1); }
    }
    @keyframes status-pop { from { opacity: .25; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes text-breathe { 50% { border-color: #4c4c51; } }
    @keyframes button-shimmer { to { transform: translateX(110%); } }
    @keyframes speaking-pulse { 50% { filter: brightness(1.08); box-shadow: 0 0 0 4px rgba(10,132,255,.10); } }
    @keyframes send-flight { 50% { transform: translate(3px,-3px) rotate(4deg); } }

    @media (max-width: 510px) {
      textarea { min-height: 170px; }
      .section { margin-top: 19px; }
      .settings-body { padding: 12px; }
      .actions { margin-top: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <svg class="liquid-filter-defs" aria-hidden="true">
    <filter id="liquidRefraction" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="7" result="liquidNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="liquidNoise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-blob one"></div><div class="bg-blob two"></div><div class="bg-blob three"></div>
  </div>
  <main class="app">
    <span class="visually-hidden" id="aiStatus">Голоса</span>

    <section class="panel" id="panel">
      <div class="label-row">
        <label class="label" for="text">Что прочитать?</label>
        <span class="count" id="count">0 знаков</span>
      </div>
      <textarea id="text" maxlength="12000" placeholder="Вставьте или напишите текст здесь…"></textarea>

      <div class="section speed-section">
        <div class="speed-head">
          <h2 class="section-title">Скорость чтения</h2>
          <output class="speed-value" id="speedValue" for="speed">1×</output>
        </div>
        <input class="speed-range" id="speed" type="range" min="0.5" max="4" step="0.01" value="1" aria-label="Скорость чтения">
        <div class="speed-scale"><span>0.5×</span><span>4×</span></div>
      </div>

      <details class="settings-card">
        <summary>
          <span>Настройки чтения</span>
          <span class="settings-summary" id="settingsSummary">Мягкий · Обычно</span>
        </summary>
        <div class="settings-body">
          <div class="settings-group">
            <h2 class="section-title">Голос</h2>
            <div class="voices" id="voices"></div>
            <button class="preview liquid-jelly" id="preview" type="button">▶ Послушать</button>
          </div>
          <div class="settings-group">
            <h2 class="section-title">Интонация</h2>
            <div class="segments segmented-slider" id="styles">
              <div class="segments-indicator segmented-indicator" id="styleIndicator"></div>
              <button type="button" data-style="calm">Спокойно</button>
              <button type="button" data-style="natural" class="active">Обычно</button>
              <button type="button" data-style="expressive">Ярко</button>
            </div>
          </div>
        </div>
      </details>

      <div class="actions">
        <button class="primary liquid-jelly" id="read" type="button">▶ Читать</button>
        <button class="secondary liquid-jelly" id="pause" type="button" aria-label="Пауза"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button class="stop liquid-jelly" id="stop" type="button" aria-label="Остановить"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      </div>
      <div class="playback" id="playback" aria-label="Перемотка записи">
        <input class="seek-range" id="seek" type="range" min="0" max="1" step="0.1" value="0" disabled aria-label="Позиция воспроизведения">
        <div class="playback-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
        <button class="send-chat liquid-jelly" id="sendVoice" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.7 18-3.8-7.2L3 10.5 21 3Z"/><path d="m9.5 13.8 4.2-4.1"/></svg>
          <span>Отправить в чат</span>
        </button>
      </div>
      <div class="status" id="status">Готово к чтению</div>
    </section>
    <p class="hint">Голос создаётся сервисом ElevenLabs</p>
  </main>

  <script type="text/plain" id="legacy-browser-voice">
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text');
    const voicesBox = document.getElementById('voices');
    const panel = document.getElementById('panel');
    const readButton = document.getElementById('read');
    const pauseButton = document.getElementById('pause');
    const stopButton = document.getElementById('stop');
    const previewButton = document.getElementById('preview');
    const statusBox = document.getElementById('status');
    const countBox = document.getElementById('count');

    const profiles = [
      { id: 'soft', name: 'Мягкий', icon: '◡', rate: .96 },
      { id: 'deep', name: 'Глубокий', icon: '◆', rate: .92 },
      { id: 'light', name: 'Светлый', icon: '✦', rate: 1.03 },
      { id: 'reader', name: 'Диктор', icon: '●', rate: 1 }
    ];
    const styles = {
      calm: { rate: .92, pause: 1.15 },
      natural: { rate: 1, pause: 1 },
      expressive: { rate: 1.05, pause: .9 }
    };

    let availableVoices = [];
    let selectedProfile = localStorage.getItem('golos-profile') || 'soft';
    let selectedStyle = localStorage.getItem('golos-style') || 'natural';
    let selectedSpeed = Number(localStorage.getItem('golos-speed')) || 1;
    let session = 0;
    let paused = false;

    textInput.value = localStorage.getItem('golos-text') || '';

    function preferredVoices() {
      const list = synth ? synth.getVoices() : [];
      const russian = list.filter(v => /^ru\b/i.test(v.lang));
      const candidates = russian.length ? russian : list;
      return [...candidates].sort((a, b) => voiceQuality(b) - voiceQuality(a));
    }

    function voiceQuality(voice) {
      const name = voice.name.toLowerCase();
      let score = 0;
      if (/natural|нейрон|neural|online/.test(name)) score += 20;
      if (/google|microsoft/.test(name)) score += 4;
      if (!voice.localService) score += 6;
      return score;
    }

    function renderVoices() {
      availableVoices = preferredVoices();
      voicesBox.innerHTML = '';
      profiles.forEach((profile, index) => {
        const voice = availableVoices[index % Math.max(availableVoices.length, 1)];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'voice' + (selectedProfile === profile.id ? ' active' : '');
        button.dataset.profile = profile.id;
        button.innerHTML = `<span class="voice-icon">${profile.icon}</span><span class="voice-copy"><span class="voice-name">${profile.name}</span><span class="voice-system">${voice ? voice.name : 'Системный голос'}</span></span>`;
        button.addEventListener('click', () => {
          selectedProfile = profile.id;
          localStorage.setItem('golos-profile', selectedProfile);
          renderVoices();
        });
        voicesBox.appendChild(button);
      });
    }

    function currentProfile() {
      const index = Math.max(0, profiles.findIndex(p => p.id === selectedProfile));
      return { profile: profiles[index], voice: availableVoices[index % Math.max(availableVoices.length, 1)] };
    }

    function splitLong(value, limit = 700) {
      if (value.length <= limit) return [value];
      const result = [];
      let rest = value;
      while (rest.length > limit) {
        let cut = Math.max(rest.lastIndexOf(', ', limit), rest.lastIndexOf(' ', limit));
        if (cut < limit * .55) cut = limit;
        result.push(rest.slice(0, cut + 1).trim());
        rest = rest.slice(cut + 1).trim();
      }
      if (rest) result.push(rest);
      return result;
    }

    function makeChunks(value) {
      const clean = value.replace(/\r/g, '').replace(/[ \t]+/g, ' ').trim();
      if (!clean) return [];
      const sentences = (clean.match(/[^.!?…\n]+[.!?…]+|[^.!?…\n]+$|\n+/g) || [clean])
        .map(x => x.trim())
        .filter(Boolean)
        .flatMap(x => splitLong(x));
      const chunks = [];
      let buffer = '';
      sentences.forEach(sentence => {
        if (buffer && buffer.length + sentence.length + 1 > 700) {
          chunks.push(buffer);
          buffer = sentence;
        } else {
          buffer = buffer ? `${buffer} ${sentence}` : sentence;
        }
      });
      if (buffer) chunks.push(buffer);
      return chunks;
    }

    function setPlaying(value) {
      panel.classList.toggle('playing', value);
      readButton.textContent = value ? 'Читаю…' : '▶ Читать';
      pauseButton.textContent = 'Ⅱ';
      paused = false;
    }

    function stopReading(message = 'Остановлено') {
      session += 1;
      if (synth) {
        synth.cancel();
        if (synth.paused) synth.resume();
      }
      setPlaying(false);
      statusBox.textContent = message;
    }

    function speakText(value, preview = false) {
      if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
        statusBox.textContent = 'Этот браузер не поддерживает озвучивание';
        return;
      }
      const chunks = makeChunks(value);
      if (!chunks.length) {
        statusBox.textContent = 'Сначала добавьте текст';
        textInput.focus();
        return;
      }

      stopReading('');
      const ownSession = session;
      const chosen = currentProfile();
      const manner = styles[selectedStyle];
      setPlaying(true);
      statusBox.textContent = preview ? `Проба: ${chosen.profile.name}` : `Читаю: ${chosen.profile.name}`;

      function speakChunk(index) {
        if (ownSession !== session) return;
        if (index >= chunks.length) {
          setPlaying(false);
          statusBox.textContent = 'Готово';
          return;
        }

        const phrase = chunks[index];
        const utterance = new SpeechSynthesisUtterance(phrase);
        if (chosen.voice) {
          utterance.voice = chosen.voice;
          utterance.lang = chosen.voice.lang;
        } else {
          utterance.lang = 'ru-RU';
        }
        utterance.rate = Math.max(.55, Math.min(1.6, selectedSpeed * manner.rate * chosen.profile.rate));
        utterance.pitch = 1;
        utterance.volume = 1;
        utterance.onend = () => {
          if (ownSession !== session) return;
          const punctuationPause = /[!?…]$/.test(phrase) ? 150 : 85;
          window.setTimeout(() => speakChunk(index + 1), punctuationPause * manner.pause);
        };
        utterance.onerror = event => {
          if (event.error === 'canceled' || event.error === 'interrupted') return;
          setPlaying(false);
          statusBox.textContent = 'Не удалось запустить голос';
        };
        synth.speak(utterance);
      }

      speakChunk(0);
    }

    function updateCount() {
      const n = textInput.value.length;
      countBox.textContent = `${n.toLocaleString('ru-RU')} ${n % 10 === 1 && n % 100 !== 11 ? 'знак' : 'знаков'}`;
      localStorage.setItem('golos-text', textInput.value);
    }

    document.getElementById('styles').addEventListener('click', event => {
      const button = event.target.closest('button[data-style]');
      if (!button) return;
      selectedStyle = button.dataset.style;
      localStorage.setItem('golos-style', selectedStyle);
      document.querySelectorAll('[data-style]').forEach(x => x.classList.toggle('active', x === button));
    });

    document.getElementById('speeds').addEventListener('click', event => {
      const button = event.target.closest('button[data-speed]');
      if (!button) return;
      selectedSpeed = Number(button.dataset.speed);
      localStorage.setItem('golos-speed', String(selectedSpeed));
      document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('active', x === button));
    });

    readButton.addEventListener('click', () => speakText(textInput.value));
    previewButton.addEventListener('click', () => speakText('Здравствуйте! Так будет звучать выбранный голос.', true));
    stopButton.addEventListener('click', () => stopReading());
    pauseButton.addEventListener('click', () => {
      if (!synth) return;
      if (paused) {
        synth.resume();
        paused = false;
        pauseButton.textContent = 'Ⅱ';
        statusBox.textContent = 'Чтение продолжено';
      } else {
        synth.pause();
        paused = true;
        pauseButton.textContent = '▶';
        statusBox.textContent = 'Пауза';
      }
    });
    textInput.addEventListener('input', updateCount);
    window.addEventListener('beforeunload', () => synth && synth.cancel());

    document.querySelectorAll('[data-style]').forEach(x => x.classList.toggle('active', x.dataset.style === selectedStyle));
    document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('active', Number(x.dataset.speed) === selectedSpeed));
    renderVoices();
    if (synth) synth.onvoiceschanged = renderVoices;
    updateCount();

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      Telegram.WebApp.setHeaderColor?.('#101112');
      Telegram.WebApp.setBackgroundColor?.('#101112');
    }
  </script>
  <script>
    const $ = id => document.getElementById(id);
    const textInput = $('text');
    const voicesBox = $('voices');
    const panel = $('panel');
    const readButton = $('read');
    const pauseButton = $('pause');
    const stopButton = $('stop');
    const previewButton = $('preview');
    const statusBox = $('status');
    const countBox = $('count');
    const aiStatus = $('aiStatus');
    const seekInput = $('seek');
    const currentTimeBox = $('currentTime');
    const totalTimeBox = $('totalTime');
    const sendVoiceButton = $('sendVoice');
    const API_BASE = 'https://golos-reader-api.ameliasolder.workers.dev';

    const profiles = [
      { id: 'soft', name: 'Мягкий', icon: '◡' },
      { id: 'deep', name: 'Глубокий', icon: '◆' },
      { id: 'calm', name: 'Спокойный', icon: '○' },
      { id: 'reader', name: 'Диктор', icon: '●' }
    ];
    const testedVoices = [
      { voice_id: 'EXAVITQu4vr4xnSDxMaL', name: 'Мягкий' },
      { voice_id: 'pNInz6obpgDQGcFmaJgB', name: 'Глубокий' },
      { voice_id: 'ErXwobaYiN019PkySvjV', name: 'Спокойный' },
      { voice_id: 'JBFqnCBsd6RMkjVDRZzb', name: 'Диктор' }
    ];
    const manners = {
      calm: { stability: .68, similarity_boost: .78, style: .08 },
      natural: { stability: .48, similarity_boost: .78, style: .18 },
      expressive: { stability: .32, similarity_boost: .75, style: .48 }
    };

    let aiVoices = [];
    let selectedProfile = localStorage.getItem('golos-profile') || 'soft';
    let selectedStyle = localStorage.getItem('golos-style') || 'natural';
    let selectedSpeed = Number(localStorage.getItem('golos-speed')) || 1;
    let audio = null;
    let audioUrl = '';
    let audioBlob = null;
    let requestController = null;
    let paused = false;
    let seeking = false;
    let speedUpdateTimer = 0;
    let speedVisualTimer = 0;

    const pauseIcon = '<svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    const playIcon = '<svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.7v12.6c0 .8.9 1.3 1.6.8l9-6.3a1 1 0 0 0 0-1.6l-9-6.3A1 1 0 0 0 8 5.7Z"/></svg>';

    textInput.maxLength = 9000;
    textInput.value = localStorage.getItem('golos-text') || '';
    if (!profiles.some(profile => profile.id === selectedProfile)) selectedProfile = 'soft';

    const styleNames = { calm: 'Спокойно', natural: 'Обычно', expressive: 'Ярко' };

    function updateSettingsSummary() {
      const profile = profiles.find(item => item.id === selectedProfile) || profiles[0];
      $('settingsSummary').textContent = `${profile.name} · ${styleNames[selectedStyle] || 'Обычно'}`;
    }

    function initLiquidTouch(root = document) {
      if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
      root.querySelectorAll('.liquid-jelly').forEach(element => {
        if (element.dataset.liquidReady) return;
        element.dataset.liquidReady = '1';
        element.addEventListener('pointerdown', event => {
          if (event.button !== undefined && event.button !== 0) return;
          const startX = event.clientX;
          const startY = event.clientY;
          element.classList.add('liquid-pressed');
          element.style.setProperty('--liquid-button-sx', '.95');
          element.style.setProperty('--liquid-button-sy', '.95');
          const move = moveEvent => {
            const dx = Math.max(-18, Math.min(18, moveEvent.clientX - startX));
            const dy = Math.max(-18, Math.min(18, moveEvent.clientY - startY));
            const stretch = Math.min(.09, (Math.abs(dx) + Math.abs(dy)) / 180);
            element.style.setProperty('--liquid-button-x', `${dx * .05}px`);
            element.style.setProperty('--liquid-button-y', `${dy * .05}px`);
            element.style.setProperty('--liquid-button-sx', String(1.01 + stretch));
            element.style.setProperty('--liquid-button-sy', String(.99 - stretch * .45));
          };
          const settle = () => {
            element.classList.remove('liquid-pressed');
            element.style.setProperty('--liquid-button-x', '0px');
            element.style.setProperty('--liquid-button-y', '0px');
            element.style.setProperty('--liquid-button-sx', '1');
            element.style.setProperty('--liquid-button-sy', '1');
            window.removeEventListener('pointermove', move);
          };
          window.addEventListener('pointermove', move, { passive: true });
          window.addEventListener('pointerup', settle, { once: true });
          window.addEventListener('pointercancel', settle, { once: true });
        });
      });
    }

    function positionStyleIndicator(button, animate = true) {
      const indicator = $('styleIndicator');
      if (!button || !indicator || !button.offsetWidth) return;
      if (!animate) indicator.classList.add('dragging');
      indicator.style.left = `${button.offsetLeft}px`;
      indicator.style.width = `${button.offsetWidth}px`;
      if (!animate) requestAnimationFrame(() => indicator.classList.remove('dragging'));
    }

    function initStyleSlider() {
      const slider = $('styles');
      const indicator = $('styleIndicator');
      let pointerId = null;
      let dragged = false;
      const buttons = () => [...slider.querySelectorAll('button[data-style]')];
      const nearest = clientX => {
        const rect = slider.getBoundingClientRect();
        return buttons().reduce((best, button) => {
          const center = button.offsetLeft + button.offsetWidth / 2;
          const bestCenter = best.offsetLeft + best.offsetWidth / 2;
          const localX = clientX - rect.left;
          return Math.abs(center - localX) < Math.abs(bestCenter - localX) ? button : best;
        }, buttons()[0]);
      };
      slider.addEventListener('pointerdown', event => {
        pointerId = event.pointerId;
        dragged = false;
      });
      slider.addEventListener('pointermove', event => {
        if (event.pointerId !== pointerId) return;
        dragged = true;
        const target = nearest(event.clientX);
        indicator.classList.add('dragging');
        indicator.style.left = `${target.offsetLeft}px`;
        indicator.style.width = `${target.offsetWidth}px`;
        const direction = event.movementX || 0;
        indicator.style.setProperty('--liquid-scale-x', '1.08');
        indicator.style.setProperty('--liquid-scale-y', '.95');
        indicator.style.setProperty('--liquid-shift-x', `${Math.max(-2, Math.min(2, direction * .2))}px`);
      });
      slider.addEventListener('pointerup', event => {
        if (event.pointerId !== pointerId) return;
        pointerId = null;
        if (!dragged) return;
        const target = nearest(event.clientX);
        indicator.classList.remove('dragging');
        indicator.style.setProperty('--liquid-scale-x', '1');
        indicator.style.setProperty('--liquid-scale-y', '1');
        indicator.style.setProperty('--liquid-shift-x', '0px');
        target.click();
      });
    }

    function setConnected(connected) {
      aiStatus.textContent = connected ? '✓ Готово' : 'Голоса';
      aiStatus.style.color = connected ? '#27835a' : '';
    }

    function positionVoiceIndicator(button, animate = true) {
      const indicator = $('voiceIndicator');
      if (!indicator || !button || !voicesBox.offsetWidth) return;
      const oldLeft = Number.parseFloat(indicator.style.left) || button.offsetLeft;
      const oldTop = Number.parseFloat(indicator.style.top) || button.offsetTop;
      const dx = button.offsetLeft - oldLeft;
      const dy = button.offsetTop - oldTop;
      if (!animate) indicator.classList.add('no-transition');
      else {
        indicator.style.setProperty('--voice-scale-x', Math.abs(dx) >= Math.abs(dy) ? '1.08' : '.96');
        indicator.style.setProperty('--voice-scale-y', Math.abs(dy) > Math.abs(dx) ? '1.08' : '.96');
      }
      indicator.style.left = `${button.offsetLeft}px`;
      indicator.style.top = `${button.offsetTop}px`;
      indicator.style.width = `${button.offsetWidth}px`;
      indicator.style.height = `${button.offsetHeight}px`;
      indicator.classList.add('ready');
      if (!animate) {
        void indicator.offsetWidth;
        indicator.classList.remove('no-transition');
      } else {
        window.setTimeout(() => {
          indicator.style.setProperty('--voice-scale-x', '1');
          indicator.style.setProperty('--voice-scale-y', '1');
        }, 90);
      }
    }

    function renderVoices() {
      voicesBox.innerHTML = '';
      const indicator = document.createElement('span');
      indicator.className = 'voice-selection';
      indicator.id = 'voiceIndicator';
      indicator.setAttribute('aria-hidden', 'true');
      voicesBox.appendChild(indicator);
      profiles.forEach((profile, index) => {
        const voice = aiVoices[index % Math.max(aiVoices.length, 1)];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'voice liquid-jelly' + (selectedProfile === profile.id ? ' active' : '');
        button.dataset.profile = profile.id;
        button.innerHTML = `<span class="voice-icon">${profile.icon}</span><span class="voice-copy"><span class="voice-name">${voice ? voice.name : profile.name}</span>${voice ? '' : '<span class="voice-system">Загрузка…</span>'}</span>`;
        button.addEventListener('click', () => {
          if (selectedProfile === profile.id) return;
          selectedProfile = profile.id;
          localStorage.setItem('golos-profile', selectedProfile);
          updateSettingsSummary();
          window.Telegram?.WebApp?.HapticFeedback?.selectionChanged?.();
          voicesBox.querySelectorAll('.voice').forEach(item => {
            item.classList.toggle('active', item === button);
            item.classList.remove('voice-picked');
          });
          positionVoiceIndicator(button);
          void button.offsetWidth;
          button.classList.add('voice-picked');
        });
        voicesBox.appendChild(button);
      });
      initLiquidTouch(voicesBox);
      requestAnimationFrame(() => positionVoiceIndicator(voicesBox.querySelector('.voice.active'), false));
    }

    function currentVoice() {
      const index = Math.max(0, profiles.findIndex(profile => profile.id === selectedProfile));
      return aiVoices[index % Math.max(aiVoices.length, 1)];
    }

    async function loadVoices() {
      statusBox.textContent = 'Загружаю AI‑голоса…';
      const initData = window.Telegram?.WebApp?.initData || '';
      const response = await fetch(API_BASE + '/voices', {
        headers: { 'X-Telegram-Init-Data': initData }
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Не удалось загрузить AI‑голоса');
      }
      await response.json();
      aiVoices = testedVoices;
      if (!aiVoices.length) throw new Error('В аккаунте пока нет доступных голосов');
      setConnected(true);
      renderVoices();
      statusBox.textContent = 'Готово к чтению';
    }

    function setPlaying(value) {
      panel.classList.toggle('playing', value);
      readButton.textContent = value ? 'Готовлю голос…' : '▶ Читать';
      readButton.classList.toggle('loading', value);
      readButton.classList.remove('speaking');
      pauseButton.innerHTML = pauseIcon;
      pauseButton.setAttribute('aria-label', 'Пауза');
      paused = false;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const rest = Math.floor(seconds % 60);
      return `${minutes}:${String(rest).padStart(2, '0')}`;
    }

    function resetSeek() {
      seekInput.disabled = true;
      seekInput.max = '1';
      seekInput.value = '0';
      seekInput.style.setProperty('--seek-progress', '0%');
      currentTimeBox.textContent = '0:00';
      totalTimeBox.textContent = '0:00';
      panel.classList.remove('audio-ready');
      sendVoiceButton.disabled = false;
      sendVoiceButton.classList.remove('sending', 'sent');
      sendVoiceButton.querySelector('span').textContent = 'Отправить в чат';
      seeking = false;
    }

    function syncSeek() {
      if (!audio || !Number.isFinite(audio.duration) || audio.duration <= 0) return;
      seekInput.max = String(audio.duration);
      if (!seeking) seekInput.value = String(audio.currentTime);
      const position = Number(seekInput.value);
      seekInput.style.setProperty('--seek-progress', `${Math.max(0, Math.min(100, position / audio.duration * 100))}%`);
      currentTimeBox.textContent = formatTime(position);
      totalTimeBox.textContent = formatTime(audio.duration);
    }

    function releaseAudio() {
      window.clearTimeout(speedUpdateTimer);
      if (audio) {
        audio.pause();
        audio.removeAttribute('src');
        audio = null;
      }
      if (audioUrl) {
        URL.revokeObjectURL(audioUrl);
        audioUrl = '';
      }
      audioBlob = null;
      resetSeek();
    }

    function stopReading(message = 'Остановлено') {
      if (requestController) requestController.abort();
      requestController = null;
      releaseAudio();
      setPlaying(false);
      statusBox.textContent = message;
    }

    async function speakText(value, preview = false) {
      const text = value.trim();
      if (!text) {
        statusBox.textContent = 'Сначала добавьте текст';
        textInput.focus();
        return;
      }
      if (!aiVoices.length) {
        statusBox.textContent = 'AI‑голоса ещё загружаются';
        return;
      }

      stopReading('');
      const voice = currentVoice();
      const manner = manners[selectedStyle];
      requestController = new AbortController();
      setPlaying(true);
      statusBox.textContent = preview ? `Создаю пример: ${voice.name}` : `Создаю речь: ${voice.name}`;

      try {
        const response = await fetch(API_BASE + '/tts', {
          method: 'POST',
          signal: requestController.signal,
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'X-Telegram-Init-Data': window.Telegram?.WebApp?.initData || ''
          },
          body: JSON.stringify({
            text,
            voice_id: voice.voice_id,
            voice_settings: {
              ...manner,
              speed: 1,
              use_speaker_boost: true
            }
          })
        });

        if (!response.ok) {
          let reason = '';
          try {
            const errorData = await response.json();
            reason = errorData.error || errorData?.detail?.message || '';
          } catch (_) {}
          if (response.status === 401) throw new Error('Откройте приложение из Telegram');
          if (response.status === 429) throw new Error(reason || 'Закончился лимит озвучивания');
          throw new Error(reason || `Сервис вернул ошибку ${response.status}`);
        }

        const blob = await response.blob();
        audioBlob = blob;
        audioUrl = URL.createObjectURL(blob);
        audio = new Audio(audioUrl);
        audio.playbackRate = selectedSpeed;
        audio.preservesPitch = true;
        audio.webkitPreservesPitch = true;
        panel.classList.add('audio-ready');
        audio.onloadedmetadata = () => {
          seekInput.disabled = false;
          syncSeek();
        };
        audio.ondurationchange = syncSeek;
        audio.ontimeupdate = syncSeek;
        audio.onplay = () => {
          readButton.textContent = 'Читаю…';
          readButton.classList.remove('loading');
          readButton.classList.add('speaking');
          statusBox.textContent = `Читает: ${voice.name}`;
        };
        audio.onended = () => {
          setPlaying(false);
          audio.currentTime = 0;
          panel.classList.add('audio-ready');
          syncSeek();
          statusBox.textContent = 'Готово — запись можно отправить в чат';
          window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.('success');
        };
        audio.onerror = () => stopReading('Не удалось воспроизвести аудио');
        await audio.play();
      } catch (error) {
        if (error.name === 'AbortError') return;
        stopReading(error.message || 'Не удалось создать речь');
      } finally {
        requestController = null;
      }
    }

    function updateCount() {
      const n = textInput.value.length;
      countBox.textContent = `${n.toLocaleString('ru-RU')} ${n % 10 === 1 && n % 100 !== 11 ? 'знак' : 'знаков'}`;
      localStorage.setItem('golos-text', textInput.value);
    }

    $('styles').addEventListener('click', event => {
      const button = event.target.closest('button[data-style]');
      if (!button) return;
      selectedStyle = button.dataset.style;
      localStorage.setItem('golos-style', selectedStyle);
      document.querySelectorAll('[data-style]').forEach(item => item.classList.toggle('active', item === button));
      positionStyleIndicator(button);
      updateSettingsSummary();
      window.Telegram?.WebApp?.HapticFeedback?.selectionChanged?.();
    });

    function updateAudioSpeed(immediate = false) {
      window.clearTimeout(speedUpdateTimer);
      if (!audio) return;
      const update = () => {
        if (!audio) return;
        audio.playbackRate = selectedSpeed;
        audio.preservesPitch = true;
        audio.webkitPreservesPitch = true;
      };
      if (immediate) update();
      else speedUpdateTimer = window.setTimeout(update, 80);
    }

    function applySpeed(value, immediate = false) {
      selectedSpeed = Math.max(.5, Math.min(4, Number(value) || 1));
      $('speed').value = String(selectedSpeed);
      $('speed').style.setProperty('--speed-progress', `${((selectedSpeed - .5) / 3.5) * 100}%`);
      const speedText = selectedSpeed.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
      $('speedValue').textContent = `${speedText}×`;
      localStorage.setItem('golos-speed', String(selectedSpeed));
      updateSettingsSummary();
      updateAudioSpeed(immediate);
    }

    async function sendVoiceToChat() {
      if (!audioBlob || sendVoiceButton.disabled) return;
      sendVoiceButton.disabled = true;
      sendVoiceButton.classList.remove('sent');
      sendVoiceButton.classList.add('sending');
      sendVoiceButton.querySelector('span').textContent = 'Отправляю…';
      statusBox.textContent = 'Отправляю голосовое сообщение';
      try {
        const form = new FormData();
        form.set('voice', audioBlob, 'golos.mp3');
        if (audio && Number.isFinite(audio.duration)) form.set('duration', String(Math.round(audio.duration)));
        const response = await fetch(API_BASE + '/send-voice', {
          method: 'POST',
          headers: { 'X-Telegram-Init-Data': window.Telegram?.WebApp?.initData || '' },
          body: form
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Не удалось отправить запись');
        sendVoiceButton.classList.remove('sending');
        sendVoiceButton.classList.add('sent');
        sendVoiceButton.querySelector('span').textContent = 'Отправлено в чат';
        statusBox.textContent = 'Голосовое сообщение появилось в чате';
        window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.('success');
      } catch (error) {
        sendVoiceButton.disabled = false;
        sendVoiceButton.classList.remove('sending');
        sendVoiceButton.querySelector('span').textContent = 'Повторить отправку';
        statusBox.textContent = error.message || 'Не удалось отправить запись';
        window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.('error');
      }
    }

    $('speed').addEventListener('input', event => {
      applySpeed(event.target.value);
      document.querySelector('.speed-section').classList.add('adjusting');
      window.clearTimeout(speedVisualTimer);
      speedVisualTimer = window.setTimeout(() => document.querySelector('.speed-section').classList.remove('adjusting'), 180);
    });
    $('speed').addEventListener('change', event => applySpeed(event.target.value, true));
    seekInput.addEventListener('pointerdown', () => { seeking = true; });
    seekInput.addEventListener('input', () => {
      if (!audio || !Number.isFinite(audio.duration)) return;
      audio.currentTime = Math.max(0, Math.min(audio.duration, Number(seekInput.value)));
      syncSeek();
    });
    const finishSeeking = () => { seeking = false; syncSeek(); };
    seekInput.addEventListener('pointerup', finishSeeking);
    seekInput.addEventListener('pointercancel', finishSeeking);
    seekInput.addEventListener('change', finishSeeking);

    readButton.addEventListener('click', () => speakText(textInput.value));
    previewButton.addEventListener('click', () => speakText('Здравствуйте! Теперь текст звучит как живая человеческая речь.', true));
    stopButton.addEventListener('click', () => stopReading());
    sendVoiceButton.addEventListener('click', sendVoiceToChat);
    pauseButton.addEventListener('click', async () => {
      if (!audio) return;
      if (paused) {
        await audio.play();
        paused = false;
        pauseButton.innerHTML = pauseIcon;
        pauseButton.setAttribute('aria-label', 'Пауза');
        statusBox.textContent = `Читает: ${currentVoice().name}`;
      } else {
        audio.pause();
        paused = true;
        pauseButton.innerHTML = playIcon;
        pauseButton.setAttribute('aria-label', 'Продолжить');
        statusBox.textContent = 'Пауза';
      }
    });

    textInput.addEventListener('input', () => {
      updateCount();
      textInput.classList.remove('typing');
      void textInput.offsetWidth;
      textInput.classList.add('typing');
    });
    new MutationObserver(() => {
      statusBox.classList.remove('status-pop');
      void statusBox.offsetWidth;
      statusBox.classList.add('status-pop');
    }).observe(statusBox, { childList: true, characterData: true, subtree: true });
    window.addEventListener('beforeunload', releaseAudio);
    document.querySelectorAll('[data-style]').forEach(item => item.classList.toggle('active', item.dataset.style === selectedStyle));
    applySpeed(selectedSpeed);
    resetSeek();
    renderVoices();
    initLiquidTouch();
    initStyleSlider();
    document.querySelector('.settings-card').addEventListener('toggle', event => {
      if (event.currentTarget.open) requestAnimationFrame(() => {
        positionStyleIndicator(document.querySelector('[data-style].active'), false);
        positionVoiceIndicator(voicesBox.querySelector('.voice.active'), false);
      });
    });
    window.addEventListener('resize', () => {
      positionStyleIndicator(document.querySelector('[data-style].active'), false);
      positionVoiceIndicator(voicesBox.querySelector('.voice.active'), false);
    });
    updateCount();
    setConnected(false);

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      Telegram.WebApp.setHeaderColor?.('#101112');
      Telegram.WebApp.setBackgroundColor?.('#101112');
    }

    loadVoices().catch(error => {
      setConnected(false);
      statusBox.textContent = error.message;
      renderVoices();
    });
  </script>
</body>
</html>
