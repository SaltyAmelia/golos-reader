<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ff">
  <title>Голос — чтение текста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ff;
      --card: #ffffff;
      --text: #201b2d;
      --muted: #756f83;
      --line: #e9e5f2;
      --accent: #7257e8;
      --accent-dark: #5e45d0;
      --accent-soft: #eeeaff;
      --danger: #d74b62;
      --shadow: 0 12px 38px rgba(67, 47, 124, .09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% -10%, #ded7ff 0, transparent 31rem),
        var(--bg);
      color: var(--text);
      font: 16px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(114, 87, 232, .27);
      color: white;
      font-size: 21px;
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.1; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .badge {
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .panel {
      padding: 18px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--shadow);
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }
    .label { font-size: 15px; font-weight: 750; }
    .count { color: var(--muted); font-size: 12px; }

    textarea {
      display: block;
      width: 100%;
      min-height: 190px;
      resize: vertical;
      padding: 15px;
      border: 1.5px solid var(--line);
      border-radius: 17px;
      outline: 0;
      background: #fbfaff;
      color: var(--text);
      line-height: 1.55;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    textarea::placeholder { color: #aaa4b5; }

    .section { margin-top: 20px; }
    .section-title { margin: 0 0 10px; font-size: 15px; }

    .voices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .voice {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 1.5px solid var(--line);
      border-radius: 15px;
      background: #fff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .voice.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .voice-icon {
      display: grid;
      flex: 0 0 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: #f1eff6;
      font-size: 17px;
    }
    .voice.active .voice-icon { background: var(--accent); color: white; }
    .voice-copy { min-width: 0; }
    .voice-name { display: block; font-size: 14px; font-weight: 750; }
    .voice-system {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }
    .segments {
      display: flex;
      gap: 5px;
      padding: 4px;
      border-radius: 14px;
      background: #f2f0f7;
    }
    .segments button {
      flex: 1;
      padding: 8px 7px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .segments button.active {
      background: white;
      color: var(--accent-dark);
      box-shadow: 0 2px 8px rgba(44, 34, 72, .08);
    }

    .preview {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 0;
      background: transparent;
      color: var(--accent-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .actions { display: flex; gap: 9px; margin-top: 17px; }
    .primary, .secondary, .stop {
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .primary {
      flex: 1;
      background: var(--accent);
      color: white;
      box-shadow: 0 9px 22px rgba(114, 87, 232, .25);
    }
    .primary:active { background: var(--accent-dark); transform: translateY(1px); }
    .secondary, .stop { display: none; width: 54px; background: #f1eff6; color: var(--text); }
    .stop { color: var(--danger); }
    .playing .secondary, .playing .stop { display: block; }

    .status {
      min-height: 20px;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .hint { margin: 14px 4px 0; color: var(--muted); font-size: 12px; text-align: center; }

    dialog {
      width: min(calc(100% - 28px), 460px);
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: white;
      color: var(--text);
      box-shadow: 0 24px 80px rgba(31, 22, 61, .3);
    }
    dialog::backdrop { background: rgba(25, 20, 40, .55); backdrop-filter: blur(3px); }
    .dialog-body { padding: 22px; }
    .dialog-body h2 { margin: 0; font-size: 21px; }
    .dialog-body p { margin: 8px 0 17px; color: var(--muted); font-size: 14px; }
    .key-input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      outline: 0;
      background: #fbfaff;
    }
    .key-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .key-help { display: block; margin-top: 9px; color: var(--accent-dark); font-size: 13px; font-weight: 700; }
    .dialog-actions { display: flex; gap: 8px; margin-top: 19px; }
    .dialog-actions button { min-height: 45px; border: 0; border-radius: 13px; font-weight: 750; cursor: pointer; }
    .connect { flex: 1; background: var(--accent); color: white; }
    .cancel { padding: 0 16px; background: #f1eff6; color: var(--text); }
    .key-note { margin-bottom: 0 !important; font-size: 12px !important; }

    @media (max-width: 510px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .panel { padding: 15px; border-radius: 21px; }
      textarea { min-height: 170px; }
      .row { grid-template-columns: 1fr; gap: 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">♪</div>
        <div>
          <h1>Голос</h1>
          <p class="subtitle">Озвучивание текста</p>
        </div>
      </div>
      <span class="badge" id="aiStatus">AI‑голос</span>
    </header>

    <section class="panel" id="panel">
      <div class="label-row">
        <label class="label" for="text">Что прочитать?</label>
        <span class="count" id="count">0 знаков</span>
      </div>
      <textarea id="text" maxlength="12000" placeholder="Вставьте или напишите текст здесь…"></textarea>

      <div class="section">
        <h2 class="section-title">Выберите голос</h2>
        <div class="voices" id="voices"></div>
        <button class="preview" id="preview" type="button">▶ Послушать голос</button>
      </div>

      <div class="row">
        <div>
          <h2 class="section-title">Манера чтения</h2>
          <div class="segments" id="styles">
            <button type="button" data-style="calm">Спокойно</button>
            <button type="button" data-style="natural" class="active">Естественно</button>
            <button type="button" data-style="expressive">Ярко</button>
          </div>
        </div>
        <div>
          <h2 class="section-title">Скорость</h2>
          <div class="segments" id="speeds">
            <button type="button" data-speed="0.82">0.8×</button>
            <button type="button" data-speed="1" class="active">1×</button>
            <button type="button" data-speed="1.18">1.2×</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="read" type="button">▶ Читать</button>
        <button class="secondary" id="pause" type="button" aria-label="Пауза">Ⅱ</button>
        <button class="stop" id="stop" type="button" aria-label="Остановить">■</button>
      </div>
      <div class="status" id="status">Готово к чтению</div>
    </section>
    <p class="hint">Нейросетевые голоса ElevenLabs · расходуется лимит аккаунта</p>
  </main>

  <script type="text/plain" id="legacy-browser-voice">
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text');
    const voicesBox = document.getElementById('voices');
    const panel = document.getElementById('panel');
    const readButton = document.getElementById('read');
    const pauseButton = document.getElementById('pause');
    const stopButton = document.getElementById('stop');
    const previewButton = document.getElementById('preview');
    const statusBox = document.getElementById('status');
    const countBox = document.getElementById('count');

    const profiles = [
      { id: 'soft', name: 'Мягкий', icon: '◡', rate: .96 },
      { id: 'deep', name: 'Глубокий', icon: '◆', rate: .92 },
      { id: 'light', name: 'Светлый', icon: '✦', rate: 1.03 },
      { id: 'reader', name: 'Диктор', icon: '●', rate: 1 }
    ];
    const styles = {
      calm: { rate: .92, pause: 1.15 },
      natural: { rate: 1, pause: 1 },
      expressive: { rate: 1.05, pause: .9 }
    };

    let availableVoices = [];
    let selectedProfile = localStorage.getItem('golos-profile') || 'soft';
    let selectedStyle = localStorage.getItem('golos-style') || 'natural';
    let selectedSpeed = Number(localStorage.getItem('golos-speed')) || 1;
    let session = 0;
    let paused = false;

    textInput.value = localStorage.getItem('golos-text') || '';

    function preferredVoices() {
      const list = synth ? synth.getVoices() : [];
      const russian = list.filter(v => /^ru\b/i.test(v.lang));
      const candidates = russian.length ? russian : list;
      return [...candidates].sort((a, b) => voiceQuality(b) - voiceQuality(a));
    }

    function voiceQuality(voice) {
      const name = voice.name.toLowerCase();
      let score = 0;
      if (/natural|нейрон|neural|online/.test(name)) score += 20;
      if (/google|microsoft/.test(name)) score += 4;
      if (!voice.localService) score += 6;
      return score;
    }

    function renderVoices() {
      availableVoices = preferredVoices();
      voicesBox.innerHTML = '';
      profiles.forEach((profile, index) => {
        const voice = availableVoices[index % Math.max(availableVoices.length, 1)];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'voice' + (selectedProfile === profile.id ? ' active' : '');
        button.dataset.profile = profile.id;
        button.innerHTML = `<span class="voice-icon">${profile.icon}</span><span class="voice-copy"><span class="voice-name">${profile.name}</span><span class="voice-system">${voice ? voice.name : 'Системный голос'}</span></span>`;
        button.addEventListener('click', () => {
          selectedProfile = profile.id;
          localStorage.setItem('golos-profile', selectedProfile);
          renderVoices();
        });
        voicesBox.appendChild(button);
      });
    }

    function currentProfile() {
      const index = Math.max(0, profiles.findIndex(p => p.id === selectedProfile));
      return { profile: profiles[index], voice: availableVoices[index % Math.max(availableVoices.length, 1)] };
    }

    function splitLong(value, limit = 700) {
      if (value.length <= limit) return [value];
      const result = [];
      let rest = value;
      while (rest.length > limit) {
        let cut = Math.max(rest.lastIndexOf(', ', limit), rest.lastIndexOf(' ', limit));
        if (cut < limit * .55) cut = limit;
        result.push(rest.slice(0, cut + 1).trim());
        rest = rest.slice(cut + 1).trim();
      }
      if (rest) result.push(rest);
      return result;
    }

    function makeChunks(value) {
      const clean = value.replace(/\r/g, '').replace(/[ \t]+/g, ' ').trim();
      if (!clean) return [];
      const sentences = (clean.match(/[^.!?…\n]+[.!?…]+|[^.!?…\n]+$|\n+/g) || [clean])
        .map(x => x.trim())
        .filter(Boolean)
        .flatMap(x => splitLong(x));
      const chunks = [];
      let buffer = '';
      sentences.forEach(sentence => {
        if (buffer && buffer.length + sentence.length + 1 > 700) {
          chunks.push(buffer);
          buffer = sentence;
        } else {
          buffer = buffer ? `${buffer} ${sentence}` : sentence;
        }
      });
      if (buffer) chunks.push(buffer);
      return chunks;
    }

    function setPlaying(value) {
      panel.classList.toggle('playing', value);
      readButton.textContent = value ? 'Читаю…' : '▶ Читать';
      pauseButton.textContent = 'Ⅱ';
      paused = false;
    }

    function stopReading(message = 'Остановлено') {
      session += 1;
      if (synth) {
        synth.cancel();
        if (synth.paused) synth.resume();
      }
      setPlaying(false);
      statusBox.textContent = message;
    }

    function speakText(value, preview = false) {
      if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
        statusBox.textContent = 'Этот браузер не поддерживает озвучивание';
        return;
      }
      const chunks = makeChunks(value);
      if (!chunks.length) {
        statusBox.textContent = 'Сначала добавьте текст';
        textInput.focus();
        return;
      }

      stopReading('');
      const ownSession = session;
      const chosen = currentProfile();
      const manner = styles[selectedStyle];
      setPlaying(true);
      statusBox.textContent = preview ? `Проба: ${chosen.profile.name}` : `Читаю: ${chosen.profile.name}`;

      function speakChunk(index) {
        if (ownSession !== session) return;
        if (index >= chunks.length) {
          setPlaying(false);
          statusBox.textContent = 'Готово';
          return;
        }

        const phrase = chunks[index];
        const utterance = new SpeechSynthesisUtterance(phrase);
        if (chosen.voice) {
          utterance.voice = chosen.voice;
          utterance.lang = chosen.voice.lang;
        } else {
          utterance.lang = 'ru-RU';
        }
        utterance.rate = Math.max(.55, Math.min(1.6, selectedSpeed * manner.rate * chosen.profile.rate));
        utterance.pitch = 1;
        utterance.volume = 1;
        utterance.onend = () => {
          if (ownSession !== session) return;
          const punctuationPause = /[!?…]$/.test(phrase) ? 150 : 85;
          window.setTimeout(() => speakChunk(index + 1), punctuationPause * manner.pause);
        };
        utterance.onerror = event => {
          if (event.error === 'canceled' || event.error === 'interrupted') return;
          setPlaying(false);
          statusBox.textContent = 'Не удалось запустить голос';
        };
        synth.speak(utterance);
      }

      speakChunk(0);
    }

    function updateCount() {
      const n = textInput.value.length;
      countBox.textContent = `${n.toLocaleString('ru-RU')} ${n % 10 === 1 && n % 100 !== 11 ? 'знак' : 'знаков'}`;
      localStorage.setItem('golos-text', textInput.value);
    }

    document.getElementById('styles').addEventListener('click', event => {
      const button = event.target.closest('button[data-style]');
      if (!button) return;
      selectedStyle = button.dataset.style;
      localStorage.setItem('golos-style', selectedStyle);
      document.querySelectorAll('[data-style]').forEach(x => x.classList.toggle('active', x === button));
    });

    document.getElementById('speeds').addEventListener('click', event => {
      const button = event.target.closest('button[data-speed]');
      if (!button) return;
      selectedSpeed = Number(button.dataset.speed);
      localStorage.setItem('golos-speed', String(selectedSpeed));
      document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('active', x === button));
    });

    readButton.addEventListener('click', () => speakText(textInput.value));
    previewButton.addEventListener('click', () => speakText('Здравствуйте! Так будет звучать выбранный голос.', true));
    stopButton.addEventListener('click', () => stopReading());
    pauseButton.addEventListener('click', () => {
      if (!synth) return;
      if (paused) {
        synth.resume();
        paused = false;
        pauseButton.textContent = 'Ⅱ';
        statusBox.textContent = 'Чтение продолжено';
      } else {
        synth.pause();
        paused = true;
        pauseButton.textContent = '▶';
        statusBox.textContent = 'Пауза';
      }
    });
    textInput.addEventListener('input', updateCount);
    window.addEventListener('beforeunload', () => synth && synth.cancel());

    document.querySelectorAll('[data-style]').forEach(x => x.classList.toggle('active', x.dataset.style === selectedStyle));
    document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('active', Number(x.dataset.speed) === selectedSpeed));
    renderVoices();
    if (synth) synth.onvoiceschanged = renderVoices;
    updateCount();

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
  <script>
    const $ = id => document.getElementById(id);
    const textInput = $('text');
    const voicesBox = $('voices');
    const panel = $('panel');
    const readButton = $('read');
    const pauseButton = $('pause');
    const stopButton = $('stop');
    const previewButton = $('preview');
    const statusBox = $('status');
    const countBox = $('count');
    const aiStatus = $('aiStatus');
    const API_BASE = 'https://golos-reader-api.ameliasolder.workers.dev';

    const profiles = [
      { id: 'soft', name: 'Мягкий', icon: '◡' },
      { id: 'deep', name: 'Глубокий', icon: '◆' },
      { id: 'light', name: 'Светлый', icon: '✦' },
      { id: 'reader', name: 'Диктор', icon: '●' }
    ];
    const manners = {
      calm: { stability: .68, similarity_boost: .78, style: .08 },
      natural: { stability: .48, similarity_boost: .78, style: .18 },
      expressive: { stability: .32, similarity_boost: .75, style: .48 }
    };

    let aiVoices = [];
    let selectedProfile = localStorage.getItem('golos-profile') || 'soft';
    let selectedStyle = localStorage.getItem('golos-style') || 'natural';
    let selectedSpeed = Number(localStorage.getItem('golos-speed')) || 1;
    let audio = null;
    let audioUrl = '';
    let requestController = null;
    let paused = false;

    textInput.maxLength = 9000;
    textInput.value = localStorage.getItem('golos-text') || '';

    function setConnected(connected) {
      aiStatus.textContent = connected ? '✓ AI готов' : 'AI‑голос';
      aiStatus.style.color = connected ? '#27835a' : '';
    }

    function renderVoices() {
      voicesBox.innerHTML = '';
      profiles.forEach((profile, index) => {
        const voice = aiVoices[index % Math.max(aiVoices.length, 1)];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'voice' + (selectedProfile === profile.id ? ' active' : '');
        button.dataset.profile = profile.id;
        button.innerHTML = `<span class="voice-icon">${profile.icon}</span><span class="voice-copy"><span class="voice-name">${voice ? voice.name : profile.name}</span><span class="voice-system">${voice ? 'Нейросетевой голос' : 'Загрузка голоса…'}</span></span>`;
        button.addEventListener('click', () => {
          selectedProfile = profile.id;
          localStorage.setItem('golos-profile', selectedProfile);
          renderVoices();
        });
        voicesBox.appendChild(button);
      });
    }

    function currentVoice() {
      const index = Math.max(0, profiles.findIndex(profile => profile.id === selectedProfile));
      return aiVoices[index % Math.max(aiVoices.length, 1)];
    }

    async function loadVoices() {
      statusBox.textContent = 'Загружаю AI‑голоса…';
      const initData = window.Telegram?.WebApp?.initData || '';
      const response = await fetch(API_BASE + '/voices', {
        headers: { 'X-Telegram-Init-Data': initData }
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Не удалось загрузить AI‑голоса');
      }
      const data = await response.json();
      aiVoices = (data.voices || []).map(voice => ({ voice_id: voice.id, name: voice.name })).filter(voice => voice.voice_id);
      if (!aiVoices.length) throw new Error('В аккаунте пока нет доступных голосов');
      setConnected(true);
      renderVoices();
      statusBox.textContent = 'Готово к чтению';
    }

    function setPlaying(value) {
      panel.classList.toggle('playing', value);
      readButton.textContent = value ? 'Готовлю голос…' : '▶ Читать';
      pauseButton.textContent = 'Ⅱ';
      paused = false;
    }

    function releaseAudio() {
      if (audio) {
        audio.pause();
        audio.removeAttribute('src');
        audio = null;
      }
      if (audioUrl) {
        URL.revokeObjectURL(audioUrl);
        audioUrl = '';
      }
    }

    function stopReading(message = 'Остановлено') {
      if (requestController) requestController.abort();
      requestController = null;
      releaseAudio();
      setPlaying(false);
      statusBox.textContent = message;
    }

    async function speakText(value, preview = false) {
      const text = value.trim();
      if (!text) {
        statusBox.textContent = 'Сначала добавьте текст';
        textInput.focus();
        return;
      }
      if (!aiVoices.length) {
        statusBox.textContent = 'AI‑голоса ещё загружаются';
        return;
      }

      stopReading('');
      const voice = currentVoice();
      const manner = manners[selectedStyle];
      requestController = new AbortController();
      setPlaying(true);
      statusBox.textContent = preview ? `Создаю пример: ${voice.name}` : `Создаю речь: ${voice.name}`;

      try {
        const response = await fetch(API_BASE + '/tts', {
          method: 'POST',
          signal: requestController.signal,
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'X-Telegram-Init-Data': window.Telegram?.WebApp?.initData || ''
          },
          body: JSON.stringify({
            text,
            voice_id: voice.voice_id,
            voice_settings: {
              ...manner,
              speed: Math.max(.7, Math.min(1.2, selectedSpeed)),
              use_speaker_boost: true
            }
          })
        });

        if (!response.ok) {
          let reason = '';
          try {
            const errorData = await response.json();
            reason = errorData.error || errorData?.detail?.message || '';
          } catch (_) {}
          if (response.status === 401) throw new Error('Откройте приложение из Telegram');
          if (response.status === 429) throw new Error('Закончился лимит озвучивания');
          throw new Error(reason || `Сервис вернул ошибку ${response.status}`);
        }

        const blob = await response.blob();
        audioUrl = URL.createObjectURL(blob);
        audio = new Audio(audioUrl);
        audio.onplay = () => {
          readButton.textContent = 'Читаю…';
          statusBox.textContent = `Читает: ${voice.name}`;
        };
        audio.onended = () => stopReading('Готово');
        audio.onerror = () => stopReading('Не удалось воспроизвести аудио');
        await audio.play();
      } catch (error) {
        if (error.name === 'AbortError') return;
        stopReading(error.message || 'Не удалось создать речь');
      } finally {
        requestController = null;
      }
    }

    function updateCount() {
      const n = textInput.value.length;
      countBox.textContent = `${n.toLocaleString('ru-RU')} ${n % 10 === 1 && n % 100 !== 11 ? 'знак' : 'знаков'}`;
      localStorage.setItem('golos-text', textInput.value);
    }

    $('styles').addEventListener('click', event => {
      const button = event.target.closest('button[data-style]');
      if (!button) return;
      selectedStyle = button.dataset.style;
      localStorage.setItem('golos-style', selectedStyle);
      document.querySelectorAll('[data-style]').forEach(item => item.classList.toggle('active', item === button));
    });

    $('speeds').addEventListener('click', event => {
      const button = event.target.closest('button[data-speed]');
      if (!button) return;
      selectedSpeed = Number(button.dataset.speed);
      localStorage.setItem('golos-speed', String(selectedSpeed));
      document.querySelectorAll('[data-speed]').forEach(item => item.classList.toggle('active', item === button));
    });

    readButton.addEventListener('click', () => speakText(textInput.value));
    previewButton.addEventListener('click', () => speakText('Здравствуйте! Теперь текст звучит как живая человеческая речь.', true));
    stopButton.addEventListener('click', () => stopReading());
    pauseButton.addEventListener('click', async () => {
      if (!audio) return;
      if (paused) {
        await audio.play();
        paused = false;
        pauseButton.textContent = 'Ⅱ';
        statusBox.textContent = `Читает: ${currentVoice().name}`;
      } else {
        audio.pause();
        paused = true;
        pauseButton.textContent = '▶';
        statusBox.textContent = 'Пауза';
      }
    });

    textInput.addEventListener('input', updateCount);
    window.addEventListener('beforeunload', releaseAudio);
    document.querySelectorAll('[data-style]').forEach(item => item.classList.toggle('active', item.dataset.style === selectedStyle));
    document.querySelectorAll('[data-speed]').forEach(item => item.classList.toggle('active', Number(item.dataset.speed) === selectedSpeed));
    renderVoices();
    updateCount();
    setConnected(false);

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    loadVoices().catch(error => {
      setConnected(false);
      statusBox.textContent = error.message;
      renderVoices();
    });
  </script>
</body>
</html>
