<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Голос — чтение текста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f3f5;
      --card: #ffffff;
      --text: #16191d;
      --muted: #6f7782;
      --line: #dfe3e8;
      --accent: #2481cc;
      --accent-dark: #1d6fae;
      --accent-soft: #eaf4fb;
      --danger: #d74b62;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 21px;
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.1; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .badge {
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      background: #e4e8ec;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }
    .label { font-size: 15px; font-weight: 750; }
    .count { color: var(--muted); font-size: 12px; }

    textarea {
      display: block;
      width: 100%;
      min-height: 190px;
      resize: vertical;
      padding: 15px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      outline: 0;
      background: #fff;
      color: var(--text);
      line-height: 1.55;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    textarea::placeholder { color: #aaa4b5; }

    .section { margin-top: 20px; }
    .section-title { margin: 0 0 10px; font-size: 15px; }

    .voices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .voice {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .voice.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .voice-icon {
      display: grid;
      flex: 0 0 34px;
      height: 34px;
      place-items: center;
      border-radius: 8px;
      background: #edf0f3;
      font-size: 17px;
    }
    .voice.active .voice-icon { background: var(--accent); color: white; }
    .voice-copy { min-width: 0; }
    .voice-name { display: block; font-size: 14px; font-weight: 750; }
    .voice-system {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }
    .segments {
      display: flex;
      gap: 5px;
      padding: 4px;
      border-radius: 10px;
      background: #edf0f3;
    }
    .segments button {
      flex: 1;
      padding: 8px 7px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .segments button.active {
      background: white;
      color: var(--accent-dark);
      box-shadow: 0 1px 2px rgba(20, 28, 36, .08);
    }

    .speed-head { display: flex; align-items: center; justify-content: space-between; }
    .speed-value { color: var(--accent-dark); font-size: 14px; font-weight: 750; }
    .speed-range {
      width: 100%;
      height: 6px;
      margin: 11px 0 8px;
      border-radius: 999px;
      outline: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .speed-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }

    .preview {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 0;
      background: transparent;
      color: var(--accent-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .actions { display: flex; gap: 9px; margin-top: 17px; }
    .primary, .secondary, .stop {
      min-height: 52px;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    .primary {
      flex: 1;
      background: var(--accent);
      color: white;
    }
    .primary:active { background: var(--accent-dark); transform: translateY(1px); }
    .secondary, .stop { display: none; width: 54px; background: #f1eff6; color: var(--text); }
    .stop { color: var(--danger); }
    .playing .secondary, .playing .stop { display: block; }

    .status {
      min-height: 20px;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .hint { margin: 14px 4px 0; color: var(--muted); font-size: 12px; text-align: center; }

    dialog {
      width: min(calc(100% - 28px), 460px);
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: white;
      color: var(--text);
      box-shadow: 0 24px 80px rgba(31, 22, 61, .3);
    }
    dialog::backdrop { background: rgba(25, 20, 40, .55); backdrop-filter: blur(3px); }
    .dialog-body { padding: 22px; }
    .dialog-body h2 { margin: 0; font-size: 21px; }
    .dialog-body p { margin: 8px 0 17px; color: var(--muted); font-size: 14px; }
    .key-input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      outline: 0;
      background: #fbfaff;
    }
    .key-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .key-help { display: block; margin-top: 9px; color: var(--accent-dark); font-size: 13px; font-weight: 700; }
    .dialog-actions { display: flex; gap: 8px; margin-top: 19px; }
    .dialog-actions button { min-height: 45px; border: 0; border-radius: 13px; font-weight: 750; cursor: pointer; }
    .connect { flex: 1; background: var(--accent); color: white; }
    .cancel { padding: 0 16px; background: #f1eff6; color: var(--text); }
    .key-note { margin-bottom: 0 !important; font-size: 12px !important; }

    @media (max-width: 510px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .panel { padding: 15px; border-radius: 12px; }
      textarea { min-height: 170px; }
      .row { grid-template-columns: 1fr; gap: 16px; }
    }
  </style>
  <style id="musicload-theme">
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

    :root {
      color-scheme: dark;
      --bg: #000;
      --card: rgba(255,255,255,.09);
      --text: rgba(255,255,255,.95);
      --muted: rgba(255,255,255,.55);
      --line: rgba(255,255,255,.14);
      --accent: #2997ff;
      --accent-dark: #5e5ce6;
      --accent-soft: rgba(41,151,255,.18);
      --danger: #ff453a;
    }

    html, body { min-height: 100%; background: #000; }
    body {
      overflow-x: hidden;
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input { font-family: inherit; }

    .bg-mesh { position: fixed; inset: -20%; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .42; }
    .bg-blob.one {
      width: 380px; height: 380px; top: -3%; left: -6%;
      background: radial-gradient(circle, #1a6bff, #5e5ce6 60%, transparent 100%);
    }
    .bg-blob.two {
      width: 350px; height: 350px; top: 31%; right: -12%;
      background: radial-gradient(circle, #bf5af2, #5e5ce6 60%, transparent 100%);
    }
    .bg-blob.three {
      width: 360px; height: 360px; bottom: -8%; left: -8%; opacity: .32;
      background: radial-gradient(circle, #2997ff, #0a84ff 52%, transparent 100%);
    }

    .app {
      position: relative; z-index: 1;
      width: min(100%, 660px);
      padding: max(36px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }

    header {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 0 18px; text-align: center;

    .hero-eyebrow {

    .hero-title span {
      background: linear-gradient(125deg, #2997ff, #5e5ce6 52%, #bf5af2);
      background-clip: text; -webkit-background-clip: text; color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .badge {
      position: absolute; top: -5px; right: 0;
      padding: 7px 10px; border: 1px solid var(--line); border-radius: 20px;
      background: rgba(255,255,255,.08); color: var(--muted); font-size: 11px;
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      cursor: default;
    }

    .panel {
      padding: 19px; border: 1px solid var(--line); border-radius: 24px;
      background: rgba(255,255,255,.09);
      box-shadow: 0 16px 44px rgba(0,0,0,.28), inset 0 .5px 0 rgba(255,255,255,.15);
      backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    }
    .label { font-size: 15px; font-weight: 700; }
    .count { color: var(--muted); }
    textarea {
      min-height: 175px; padding: 15px 16px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
      background: rgba(255,255,255,.07); color: var(--text);
      font-size: 15px; font-weight: 500; line-height: 1.55;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    textarea:focus { border-color: rgba(41,151,255,.65); box-shadow: 0 0 0 3px rgba(41,151,255,.14); }
    textarea::placeholder { color: rgba(255,255,255,.28); }

    .section { margin-top: 19px; }
    .section-title { color: var(--text); font-size: 14px; font-weight: 700; }
    .voices { gap: 9px; }
    .voice {
      min-height: 60px; padding: 10px 11px;
      border: 1px solid rgba(255,255,255,.10); border-radius: 17px;
      background: rgba(255,255,255,.065); color: var(--text);
      transition: transform .14s, background .16s, border-color .16s;
    }
    .voice:active { transform: scale(.98); }
    .voice.active {
      border-color: rgba(41,151,255,.55); background: rgba(41,151,255,.15);
      box-shadow: inset 0 .5px 0 rgba(255,255,255,.16), 0 7px 20px rgba(24,92,170,.13);
    }
    .voice-icon {
      border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.72);
    }
    .voice.active .voice-icon {
      border-color: rgba(41,151,255,.40);
      background: linear-gradient(145deg, #2997ff, #5e5ce6); color: #fff;
      box-shadow: 0 4px 13px rgba(41,151,255,.28);
    }
    .voice-name { font-weight: 700; }
    .voice-system { color: var(--muted); }

    .preview { color: #69b5ff; font-weight: 600; }
    .segments {
      padding: 3px; border: 1px solid rgba(255,255,255,.09); border-radius: 50px;
      background: rgba(20,20,28,.45);
    }
    .segments button { min-height: 36px; border-radius: 50px; color: var(--muted); font-weight: 600; }
    .segments button.active {
      background: rgba(255,255,255,.17); color: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.2), inset 0 .5px 0 rgba(255,255,255,.3);
    }
    .speed-value { color: #69b5ff; }
    .speed-range { accent-color: #2997ff; }
    .speed-scale { color: rgba(255,255,255,.38); }

    .primary, .secondary, .stop { border-radius: 16px; }
    .primary {
      background: linear-gradient(145deg, #2997ff, #5e5ce6); color: white;
      box-shadow: 0 7px 22px rgba(41,151,255,.32), inset 0 .5px 0 rgba(255,255,255,.26);
      font-weight: 700;
    }
    .primary:active { background: linear-gradient(145deg, #1d7fe8, #4b48d9); transform: scale(.985); }
    .secondary, .stop {
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.09); color: var(--text);
    }
    .stop { color: var(--danger); }
    .status, .hint { color: var(--muted); }

    @media (max-width: 510px) {
      .app { padding-left: 14px; padding-right: 14px; }
      header { margin-bottom: 15px; }
      .hero-title { font-size: 28px; }
      .badge { top: -18px; right: 1px; }
      .panel { padding: 15px; border-radius: 22px; }
      .row { grid-template-columns: 1fr; gap: 17px; }
      textarea { min-height: 155px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>

<body>
  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-blob one"></div><div class="bg-blob two"></div><div class="bg-blob three"></div>
  </div>
  <main class="app">
    <header>
      <p class="hero-eyebrow">ГОЛОС</p>
      <h1 class="hero-title">Озвучка</h1>
      <p class="subtitle">Текст · живые голоса · удобная скорость</p>
      <span class="badge" id="aiStatus">Голоса</span>
    </header>

    <section class="panel" id="panel">
      <div class="label-row">
        <label class="label" for="text">Что прочитать?</label>
        <span class="count" id="count">0 знаков</span>
      </div>
      <textarea id="text" maxlength="12000" placeholder="Вставьте или напишите текст здесь…"></textarea>

      <div class="section">
        <h2 class="section-title">Выберите голос</h2>
        <div class="voices" id="voices"></div>
        <button class="preview" id="preview" type="button">▶ Послушать голос</button>
      </div>

      <div class="row">
        <div>
          <h2 class="section-title">Манера чтения</h2>
          <div class="segments" id="styles">
            <button type="button" data-style="calm">Спокойно</button>
            <button type="button" data-style="natural" class="active">Естественно</button>
            <button type="button" data-style="expressive">Ярко</button>
          </div>
        </div>
        <div>
          <div class="speed-head">
            <h2 class="section-title">Скорость</h2>
            <output class="speed-value" id="speedValue" for="speed">1×</output>
          </div>
          <input class="speed-range" id="speed" type="range" min="0.5" max="4" step="0.1" value="1" aria-label="Скорость чтения">
          <div class="speed-scale"><span>0.5×</span><span>1×</span><span>4×</span></div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="read" type="button">▶ Читать</button>
        <button class="secondary" id="pause" type="button" aria-label="Пауза">Ⅱ</button>
        <button class="stop" id="stop" type="button" aria-label="Остановить">■</button>
      </div>
      <div class="status" id="status">Готово к чтению</div>
    </section>
    <p class="hint">Голос создаётся сервисом ElevenLabs</p>
  </main>

  <script type="text/plain" id="legacy-browser-voice">
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text');
    const voicesBox = document.getElementById('voices');
    const panel = document.getElementById('panel');
    const readButton = document.getElementById('read');
    const pauseButton = document.getElementById('pause');
    const stopButton = document.getElementById('stop');
    const previewButton = document.getElementById('preview');
    const statusBox = document.getElementById('status');
    const countBox = document.getElementById('count');

    const profiles = [
      { id: 'soft', name: 'Мягкий', icon: '◡', rate: .96 },
      { id: 'deep', name: 'Глубокий', icon: '◆', rate: .92 },
      { id: 'light', name: 'Светлый', icon: '✦', rate: 1.03 },
      { id: 'reader', name: 'Диктор', icon: '●', rate: 1 }
    ];
    const styles = {
      calm: { rate: .92, pause: 1.15 },
      natural: { rate: 1, pause: 1 },
      expressive: { rate: 1.05, pause: .9 }
    };

    let availableVoices = [];
    let selectedProfile = localStorage.getItem('golos-profile') || 'soft';
    let selectedStyle = localStorage.getItem('golos-style') || 'natural';
    let selectedSpeed = Number(localStorage.getItem('golos-speed')) || 1;
    let session = 0;
    let paused = false;

    textInput.value = localStorage.getItem('golos-text') || '';

    function preferredVoices() {
      const list = synth ? synth.getVoices() : [];
      const russian = list.filter(v => /^ru\b/i.test(v.lang));
      const candidates = russian.length ? russian : list;
      return [...candidates].sort((a, b) => voiceQuality(b) - voiceQuality(a));
    }

    function voiceQuality(voice) {
      const name = voice.name.toLowerCase();
      let score = 0;
      if (/natural|нейрон|neural|online/.test(name)) score += 20;
      if (/google|microsoft/.test(name)) score += 4;
      if (!voice.localService) score += 6;
      return score;
    }

    function renderVoices() {
      availableVoices = preferredVoices();
      voicesBox.innerHTML = '';
      profiles.forEach((profile, index) => {
        const voice = availableVoices[index % Math.max(availableVoices.length, 1)];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'voice' + (selectedProfile === profile.id ? ' active' : '');
        button.dataset.profile = profile.id;
        button.innerHTML = `<span class="voice-icon">${profile.icon}</span><span class="voice-copy"><span class="voice-name">${profile.name}</span><span class="voice-system">${voice ? voice.name : 'Системный голос'}</span></span>`;
        button.addEventListener('click', () => {
          selectedProfile = profile.id;
          localStorage.setItem('golos-profile', selectedProfile);
          renderVoices();
        });
        voicesBox.appendChild(button);
      });
    }

    function currentProfile() {
      const index = Math.max(0, profiles.findIndex(p => p.id === selectedProfile));
      return { profile: profiles[index], voice: availableVoices[index % Math.max(availableVoices.length, 1)] };
    }

    function splitLong(value, limit = 700) {
      if (value.length <= limit) return [value];
      const result = [];
      let rest = value;
      while (rest.length > limit) {
        let cut = Math.max(rest.lastIndexOf(', ', limit), rest.lastIndexOf(' ', limit));
        if (cut < limit * .55) cut = limit;
        result.push(rest.slice(0, cut + 1).trim());
        rest = rest.slice(cut + 1).trim();
      }
      if (rest) result.push(rest);
      return result;
    }

    function makeChunks(value) {
      const clean = value.replace(/\r/g, '').replace(/[ \t]+/g, ' ').trim();
      if (!clean) return [];
      const sentences = (clean.match(/[^.!?…\n]+[.!?…]+|[^.!?…\n]+$|\n+/g) || [clean])
        .map(x => x.trim())
        .filter(Boolean)
        .flatMap(x => splitLong(x));
      const chunks = [];
      let buffer = '';
      sentences.forEach(sentence => {
        if (buffer && buffer.length + sentence.length + 1 > 700) {
          chunks.push(buffer);
          buffer = sentence;
        } else {
          buffer = buffer ? `${buffer} ${sentence}` : sentence;
        }
      });
      if (buffer) chunks.push(buffer);
      return chunks;
    }

    function setPlaying(value) {
      panel.classList.toggle('playing', value);
      readButton.textContent = value ? 'Читаю…' : '▶ Читать';
      pauseButton.textContent = 'Ⅱ';
      paused = false;
    }

    function stopReading(message = 'Остановлено') {
      session += 1;
      if (synth) {
        synth.cancel();
        if (synth.paused) synth.resume();
      }
      setPlaying(false);
      statusBox.textContent = message;
    }

    function speakText(value, preview = false) {
      if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
        statusBox.textContent = 'Этот браузер не поддерживает озвучивание';
        return;
      }
      const chunks = makeChunks(value);
      if (!chunks.length) {
        statusBox.textContent = 'Сначала добавьте текст';
        textInput.focus();
        return;
      }

      stopReading('');
      const ownSession = session;
      const chosen = currentProfile();
      const manner = styles[selectedStyle];
      setPlaying(true);
      statusBox.textContent = preview ? `Проба: ${chosen.profile.name}` : `Читаю: ${chosen.profile.name}`;

      function speakChunk(index) {
        if (ownSession !== session) return;
        if (index >= chunks.length) {
          setPlaying(false);
          statusBox.textContent = 'Готово';
          return;
        }

        const phrase = chunks[index];
        const utterance = new SpeechSynthesisUtterance(phrase);
        if (chosen.voice) {
          utterance.voice = chosen.voice;
          utterance.lang = chosen.voice.lang;
        } else {
          utterance.lang = 'ru-RU';
        }
        utterance.rate = Math.max(.55, Math.min(1.6, selectedSpeed * manner.rate * chosen.profile.rate));
        utterance.pitch = 1;
        utterance.volume = 1;
        utterance.onend = () => {
          if (ownSession !== session) return;
          const punctuationPause = /[!?…]$/.test(phrase) ? 150 : 85;
          window.setTimeout(() => speakChunk(index + 1), punctuationPause * manner.pause);
        };
        utterance.onerror = event => {
          if (event.error === 'canceled' || event.error === 'interrupted') return;
          setPlaying(false);
          statusBox.textContent = 'Не удалось запустить голос';
        };
        synth.speak(utterance);
      }

      speakChunk(0);
    }

    function updateCount() {
      const n = textInput.value.length;
      countBox.textContent = `${n.toLocaleString('ru-RU')} ${n % 10 === 1 && n % 100 !== 11 ? 'знак' : 'знаков'}`;
      localStorage.setItem('golos-text', textInput.value);
    }

    document.getElementById('styles').addEventListener('click', event => {
      const button = event.target.closest('button[data-style]');
      if (!button) return;
      selectedStyle = button.dataset.style;
      localStorage.setItem('golos-style', selectedStyle);
      document.querySelectorAll('[data-style]').forEach(x => x.classList.toggle('active', x === button));
    });

    document.getElementById('speeds').addEventListener('click', event => {
      const button = event.target.closest('button[data-speed]');
      if (!button) return;
      selectedSpeed = Number(button.dataset.speed);
      localStorage.setItem('golos-speed', String(selectedSpeed));
      document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('active', x === button));
    });

    readButton.addEventListener('click', () => speakText(textInput.value));
    previewButton.addEventListener('click', () => speakText('Здравствуйте! Так будет звучать выбранный голос.', true));
    stopButton.addEventListener('click', () => stopReading());
    pauseButton.addEventListener('click', () => {
      if (!synth) return;
      if (paused) {
        synth.resume();
        paused = false;
        pauseButton.textContent = 'Ⅱ';
        statusBox.textContent = 'Чтение продолжено';
      } else {
        synth.pause();
        paused = true;
        pauseButton.textContent = '▶';
        statusBox.textContent = 'Пауза';
      }
    });
    textInput.addEventListener('input', updateCount);
    window.addEventListener('beforeunload', () => synth && synth.cancel());

    document.querySelectorAll('[data-style]').forEach(x => x.classList.toggle('active', x.dataset.style === selectedStyle));
    document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('active', Number(x.dataset.speed) === selectedSpeed));
    renderVoices();
    if (synth) synth.onvoiceschanged = renderVoices;
    updateCount();

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
  <script>
    const $ = id => document.getElementById(id);
    const textInput = $('text');
    const voicesBox = $('voices');
    const panel = $('panel');
    const readButton = $('read');
    const pauseButton = $('pause');
    const stopButton = $('stop');
    const previewButton = $('preview');
    const statusBox = $('status');
    const countBox = $('count');
    const aiStatus = $('aiStatus');
    const API_BASE = 'https://golos-reader-api.ameliasolder.workers.dev';

    const profiles = [
      { id: 'soft', name: 'Мягкий', icon: '◡' },
      { id: 'deep', name: 'Глубокий', icon: '◆' },
      { id: 'calm', name: 'Спокойный', icon: '○' },
      { id: 'reader', name: 'Диктор', icon: '●' }
    ];
    const testedVoices = [
      { voice_id: 'EXAVITQu4vr4xnSDxMaL', name: 'Мягкий' },
      { voice_id: 'pNInz6obpgDQGcFmaJgB', name: 'Глубокий' },
      { voice_id: 'ErXwobaYiN019PkySvjV', name: 'Спокойный' },
      { voice_id: 'JBFqnCBsd6RMkjVDRZzb', name: 'Диктор' }
    ];
    const manners = {
      calm: { stability: .68, similarity_boost: .78, style: .08 },
      natural: { stability: .48, similarity_boost: .78, style: .18 },
      expressive: { stability: .32, similarity_boost: .75, style: .48 }
    };

    let aiVoices = [];
    let selectedProfile = localStorage.getItem('golos-profile') || 'soft';
    let selectedStyle = localStorage.getItem('golos-style') || 'natural';
    let selectedSpeed = Number(localStorage.getItem('golos-speed')) || 1;
    let audio = null;
    let audioUrl = '';
    let requestController = null;
    let paused = false;

    textInput.maxLength = 9000;
    textInput.value = localStorage.getItem('golos-text') || '';
    if (!profiles.some(profile => profile.id === selectedProfile)) selectedProfile = 'soft';

    function setConnected(connected) {
      aiStatus.textContent = connected ? '✓ Готово' : 'Голоса';
      aiStatus.style.color = connected ? '#27835a' : '';
    }

    function renderVoices() {
      voicesBox.innerHTML = '';
      profiles.forEach((profile, index) => {
        const voice = aiVoices[index % Math.max(aiVoices.length, 1)];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'voice' + (selectedProfile === profile.id ? ' active' : '');
        button.dataset.profile = profile.id;
        button.innerHTML = `<span class="voice-icon">${profile.icon}</span><span class="voice-copy"><span class="voice-name">${voice ? voice.name : profile.name}</span><span class="voice-system">${voice ? 'Нажмите, чтобы выбрать' : 'Загрузка…'}</span></span>`;
        button.addEventListener('click', () => {
          selectedProfile = profile.id;
          localStorage.setItem('golos-profile', selectedProfile);
          renderVoices();
        });
        voicesBox.appendChild(button);
      });
    }

    function currentVoice() {
      const index = Math.max(0, profiles.findIndex(profile => profile.id === selectedProfile));
      return aiVoices[index % Math.max(aiVoices.length, 1)];
    }

    async function loadVoices() {
      statusBox.textContent = 'Загружаю AI‑голоса…';
      const initData = window.Telegram?.WebApp?.initData || '';
      const response = await fetch(API_BASE + '/voices', {
        headers: { 'X-Telegram-Init-Data': initData }
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Не удалось загрузить AI‑голоса');
      }
      await response.json();
      aiVoices = testedVoices;
      if (!aiVoices.length) throw new Error('В аккаунте пока нет доступных голосов');
      setConnected(true);
      renderVoices();
      statusBox.textContent = 'Готово к чтению';
    }

    function setPlaying(value) {
      panel.classList.toggle('playing', value);
      readButton.textContent = value ? 'Готовлю голос…' : '▶ Читать';
      pauseButton.textContent = 'Ⅱ';
      paused = false;
    }

    function releaseAudio() {
      if (audio) {
        audio.pause();
        audio.removeAttribute('src');
        audio = null;
      }
      if (audioUrl) {
        URL.revokeObjectURL(audioUrl);
        audioUrl = '';
      }
    }

    function stopReading(message = 'Остановлено') {
      if (requestController) requestController.abort();
      requestController = null;
      releaseAudio();
      setPlaying(false);
      statusBox.textContent = message;
    }

    async function speakText(value, preview = false) {
      const text = value.trim();
      if (!text) {
        statusBox.textContent = 'Сначала добавьте текст';
        textInput.focus();
        return;
      }
      if (!aiVoices.length) {
        statusBox.textContent = 'AI‑голоса ещё загружаются';
        return;
      }

      stopReading('');
      const voice = currentVoice();
      const manner = manners[selectedStyle];
      requestController = new AbortController();
      setPlaying(true);
      statusBox.textContent = preview ? `Создаю пример: ${voice.name}` : `Создаю речь: ${voice.name}`;

      try {
        const response = await fetch(API_BASE + '/tts', {
          method: 'POST',
          signal: requestController.signal,
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'X-Telegram-Init-Data': window.Telegram?.WebApp?.initData || ''
          },
          body: JSON.stringify({
            text,
            voice_id: voice.voice_id,
            voice_settings: {
              ...manner,
              speed: 1,
              use_speaker_boost: true
            }
          })
        });

        if (!response.ok) {
          let reason = '';
          try {
            const errorData = await response.json();
            reason = errorData.error || errorData?.detail?.message || '';
          } catch (_) {}
          if (response.status === 401) throw new Error('Откройте приложение из Telegram');
          if (response.status === 429) throw new Error('Закончился лимит озвучивания');
          throw new Error(reason || `Сервис вернул ошибку ${response.status}`);
        }

        const blob = await response.blob();
        audioUrl = URL.createObjectURL(blob);
        audio = new Audio(audioUrl);
        audio.playbackRate = selectedSpeed;
        audio.preservesPitch = true;
        audio.webkitPreservesPitch = true;
        audio.onplay = () => {
          readButton.textContent = 'Читаю…';
          statusBox.textContent = `Читает: ${voice.name}`;
        };
        audio.onended = () => stopReading('Готово');
        audio.onerror = () => stopReading('Не удалось воспроизвести аудио');
        await audio.play();
      } catch (error) {
        if (error.name === 'AbortError') return;
        stopReading(error.message || 'Не удалось создать речь');
      } finally {
        requestController = null;
      }
    }

    function updateCount() {
      const n = textInput.value.length;
      countBox.textContent = `${n.toLocaleString('ru-RU')} ${n % 10 === 1 && n % 100 !== 11 ? 'знак' : 'знаков'}`;
      localStorage.setItem('golos-text', textInput.value);
    }

    $('styles').addEventListener('click', event => {
      const button = event.target.closest('button[data-style]');
      if (!button) return;
      selectedStyle = button.dataset.style;
      localStorage.setItem('golos-style', selectedStyle);
      document.querySelectorAll('[data-style]').forEach(item => item.classList.toggle('active', item === button));
    });

    function applySpeed(value) {
      selectedSpeed = Math.max(.5, Math.min(4, Number(value) || 1));
      $('speed').value = String(selectedSpeed);
      $('speedValue').textContent = `${selectedSpeed.toFixed(1).replace('.0', '')}×`;
      localStorage.setItem('golos-speed', String(selectedSpeed));
      if (audio) {
        audio.playbackRate = selectedSpeed;
        audio.preservesPitch = true;
        audio.webkitPreservesPitch = true;
      }
    }

    $('speed').addEventListener('input', event => applySpeed(event.target.value));

    readButton.addEventListener('click', () => speakText(textInput.value));
    previewButton.addEventListener('click', () => speakText('Здравствуйте! Теперь текст звучит как живая человеческая речь.', true));
    stopButton.addEventListener('click', () => stopReading());
    pauseButton.addEventListener('click', async () => {
      if (!audio) return;
      if (paused) {
        await audio.play();
        paused = false;
        pauseButton.textContent = 'Ⅱ';
        statusBox.textContent = `Читает: ${currentVoice().name}`;
      } else {
        audio.pause();
        paused = true;
        pauseButton.textContent = '▶';
        statusBox.textContent = 'Пауза';
      }
    });

    textInput.addEventListener('input', updateCount);
    window.addEventListener('beforeunload', releaseAudio);
    document.querySelectorAll('[data-style]').forEach(item => item.classList.toggle('active', item.dataset.style === selectedStyle));
    applySpeed(selectedSpeed);
    renderVoices();
    updateCount();
    setConnected(false);

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    loadVoices().catch(error => {
      setConnected(false);
      statusBox.textContent = error.message;
      renderVoices();
    });
  </script>
</body>
